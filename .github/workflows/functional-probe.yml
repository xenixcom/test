name: Functional runner probe
on:
  push:
    paths: ['.github/workflows/functional-probe.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Boot and verify simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) for x in d[k] if x["name"].startswith("iPhone")))') 
          trap 'xcrun simctl shutdown "$UDID" || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" launchctl print system >/dev/null
          xcrun simctl io "$UDID" screenshot simulator.png
          echo SIMULATOR_BOOT_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-probe
          path: simulator.png
          retention-days: 1
  failure:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Intentional failure first attempt
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT"
          test "$GITHUB_RUN_ATTEMPT" -gt 1
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate deterministic binary
        run: |
          python3 -c 'from pathlib import Path; import hashlib; p=bytes(range(256))*4096; Path("fixture.bin").write_bytes(p); print("SHA256",hashlib.sha256(p).hexdigest())'
      - uses: actions/upload-artifact@v4
        with:
          name: binary-probe
          path: fixture.bin
          retention-days: 1
