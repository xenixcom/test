name: Synthetic mobile microphone probe
on:
  push:
    paths: ['.github/workflows/synthetic-mobile-audio.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Set up synthetic audio route
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask blackhole-2ch
          sudo -n launchctl kickstart -k system/com.apple.audio.coreaudiod || sudo -n killall coreaudiod
          sleep 5
          cat > /tmp/route.swift <<'SWIFT'
          import Foundation
          import CoreAudio
          func addr(_ s:AudioObjectPropertySelector)->AudioObjectPropertyAddress {
              AudioObjectPropertyAddress(mSelector:s,mScope:kAudioObjectPropertyScopeGlobal,mElement:kAudioObjectPropertyElementMain)
          }
          let sys=AudioObjectID(kAudioObjectSystemObject)
          var a=addr(kAudioHardwarePropertyDevices),size:UInt32=0
          guard AudioObjectGetPropertyDataSize(sys,&a,0,nil,&size)==0 else {exit(1)}
          var ids=[AudioDeviceID](repeating:0,count:Int(size)/4)
          guard AudioObjectGetPropertyData(sys,&a,0,nil,&size,&ids)==0 else {exit(2)}
          var selected:AudioDeviceID=0
          for id in ids {
              var n=addr(kAudioObjectPropertyName),name:CFString?=nil
              var len=UInt32(MemoryLayout<CFString?>.size)
              if AudioObjectGetPropertyData(id,&n,0,nil,&len,&name)==0,let name=name,(name as String)=="BlackHole 2ch" {selected=id}
          }
          guard selected != 0 else {exit(3)}
          for s in [kAudioHardwarePropertyDefaultInputDevice,kAudioHardwarePropertyDefaultOutputDevice] {
              var a=addr(s),target=selected,actual:AudioDeviceID=0,len:UInt32=4
              guard AudioObjectSetPropertyData(sys,&a,0,nil,4,&target)==0,AudioObjectGetPropertyData(sys,&a,0,nil,&len,&actual)==0,actual==target else {exit(4)}
          }
          print("SYNTHETIC_ROUTE_READY")
          SWIFT
          swiftc /tmp/route.swift -o /tmp/route
          /tmp/route
          python3 - <<'PY'
          import wave,struct,math
          with wave.open("stimulus.wav","wb") as w:
              w.setparams((1,2,48000,144000,"NONE","not compressed"))
              w.writeframes(b"".join(struct.pack("<h",int(7000*math.sin(2*math.pi*523*i/48000))) for i in range(144000)))
          PY
      - name: Build and run independent microphone app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Probe.app
          cat > /tmp/Probe.swift <<'SWIFT'
          import UIKit
          import AVFoundation
          @main
          class Probe: UIResponder, UIApplicationDelegate {
              var window:UIWindow?
              var recorder:AVAudioRecorder?
              func application(_ application:UIApplication,didFinishLaunchingWithOptions launchOptions:[UIApplication.LaunchOptionsKey:Any]?=nil)->Bool {
                  window=UIWindow(frame:UIScreen.main.bounds)
                  window?.rootViewController=UIViewController()
                  window?.makeKeyAndVisible()
                  do {
                      let session=AVAudioSession.sharedInstance()
                      try session.setCategory(.record,mode:.measurement)
                      try session.setActive(true)
                      let dir=FileManager.default.urls(for:.documentDirectory,in:.userDomainMask)[0]
                      recorder=try AVAudioRecorder(url:dir.appendingPathComponent("sample.wav"),settings:[AVFormatIDKey:kAudioFormatLinearPCM,AVSampleRateKey:48000,AVNumberOfChannelsKey:1,AVLinearPCMBitDepthKey:16,AVLinearPCMIsFloatKey:false])
                      guard recorder!.record(forDuration:12) else {throw NSError(domain:"record",code:1)}
                      try Data("ready".utf8).write(to:dir.appendingPathComponent("ready"))
                  } catch {print("PROBE_ERROR",error)}
                  return true
              }
          }
          SWIFT
          cat > Probe.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>org.example.syntheticmic</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundleName</key><string>Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>NSMicrophoneUsageDescription</key><string>Record synthetic test tone</string>
          <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          PLIST
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios17.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" /tmp/Probe.swift -o Probe.app/Probe
          codesign --force --sign - Probe.app
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) for x in d[k] if x["name"].startswith("iPhone")))')
          trap 'xcrun simctl shutdown "$UDID" || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" Probe.app
          xcrun simctl privacy "$UDID" grant microphone org.example.syntheticmic
          DATA=$(xcrun simctl get_app_container "$UDID" org.example.syntheticmic data)
          xcrun simctl launch "$UDID" org.example.syntheticmic
          for i in $(seq 1 30); do
            [ -f "$DATA/Documents/ready" ] && break
            sleep 1
          done
          test -f "$DATA/Documents/ready"
          afplay stimulus.wav
          sleep 12
          cp "$DATA/Documents/sample.wav" sample.wav
      - name: Quantify synthetic tone
        run: |
          python3 - <<'PY'
          import wave,struct,math
          with wave.open("sample.wav","rb") as w:
              rate=w.getframerate(); assert w.getsampwidth()==2 and w.getnchannels()==1
              raw=w.readframes(w.getnframes())
          s=struct.unpack("<"+"h"*(len(raw)//2),raw); n=rate//5
          def power(b,f):
              return abs(sum(x*complex(math.cos(2*math.pi*f*i/rate),math.sin(2*math.pi*f*i/rate)) for i,x in enumerate(b)))**2/len(b)**2
          p=max(power(s[i:i+n],523) for i in range(0,len(s)-n+1,n))
          print("IOS_TONE_POWER",p,"SAMPLES",len(s),"RATE",rate)
          assert p>100
          print("IOS_SYNTHETIC_MIC_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-synthetic-audio
          path: sample.wav
          retention-days: 1
          if-no-files-found: ignore
  android:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Boot ARM Android emulator with host audio enabled
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          EMU="$SDK/emulator/emulator"
          ADB="$SDK/platform-tools/adb"
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          AVDM="$(dirname "$SDKM")/avdmanager"
          IMG="system-images;android-33;google_apis;arm64-v8a"
          brew install --cask blackhole-2ch
          sudo -n launchctl kickstart -k system/com.apple.audio.coreaudiod || sudo -n killall coreaudiod
          sleep 5
          system_profiler SPAudioDataType | grep -A10 'BlackHole 2ch'
          "$SDKM" "$IMG"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/probe-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDM" create avd --force -n synthetic_audio -k "$IMG" -p "$ANDROID_AVD_HOME/synthetic_audio.avd"
          "$EMU" -list-avds | grep -Fx synthetic_audio
          "$EMU" -avd synthetic_audio -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -allow-host-audio > emulator.log 2>&1 &
          EPID=$!
          trap '"$ADB" -s emulator-5554 emu kill || true; kill "$EPID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if [ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then
              "$ADB" -s emulator-5554 emu avd hostmicon
              echo MAC_ANDROID_BOOT_PASS
              exit 0
            fi
            if ! kill -0 "$EPID" 2>/dev/null; then tail -50 emulator.log; exit 1; fi
            sleep 3
          done
          tail -50 emulator.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-android-boot-log
          path: emulator.log
          retention-days: 1
          if-no-files-found: ignore
